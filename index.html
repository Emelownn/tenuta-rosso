<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenuta Rosso | Domaine Viticole</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101010;
    color: #eee7d8;
    font-family: Georgia, serif;
}

header {
    padding: 25px 7%;
    border-bottom: 1px solid #a98b50;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #c5a15a;
    font-size: 25px;
    letter-spacing: 4px;
}

.hero {
    min-height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(#0009, #000b),
    url('https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=1800')
    center/cover;
}

.hero h1 {
    color: #d0ad69;
    font-size: clamp(38px, 7vw, 70px);
    letter-spacing: 7px;
}

.line {
    width: 90px;
    height: 2px;
    background: #8b2635;
    margin: 25px auto;
}

.hero p {
    margin-top: 15px;
    letter-spacing: 3px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #a98b50;
    border-top: 1px solid #493b28;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">TENUTA ROSSO</div>
    <div>DOMAINE VITICOLE ITALIEN</div>
</header>

<section class="hero">
    <h1>TENUTA ROSSO</h1>
    <div class="line"></div>
    <p>DOMAINE VITICOLE ITALIEN</p>
    <p>Famiglia • Onore • Tradizione</p>
</section>

<footer>
    TENUTA ROSSO — DOMAINE VITICOLE ITALIEN
</footer>

</body>
</html>
